<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>
    Change Password - Learning Module System
  </title>

  <link
    rel="stylesheet"
    href="css/style.css"
  >
</head>

<body class="login-page">

  <main
    class="login-container"
    style="max-width:600px;display:block;padding:35px"
  >
    <h1>Learning Module System</h1>

    <h2>Change Password</h2>

    <p id="intro">
      Enter your current password and choose a new one.
    </p>

    <form
      id="change-form"
      class="login-form"
    >
      <label for="current">
        Current / temporary password
      </label>

      <input
        id="current"
        type="password"
        autocomplete="current-password"
        required
      >

      <label for="new">
        New password
      </label>

      <input
        id="new"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <label for="confirm">
        Confirm new password
      </label>

      <input
        id="confirm"
        type="password"
        autocomplete="new-password"
        minlength="8"
        required
      >

      <button
        class="login-button"
        type="submit"
      >
        Update Password
      </button>

      <p id="message" role="status"></p>
    </form>

    <p>
      <a
        id="back"
        href="dashboard.html"
      >
        Back to Dashboard
      </a>
    </p>
  </main>

  <script src="js/app.js"></script>

  <script>
    if (!getToken()) {
      location.replace('login.html');
    }

    if (getUser()?.must_change_password) {
      document.getElementById('intro').textContent =
        'Your temporary password must be changed before you can continue.';

      document.getElementById('back').hidden = true;
    }

    document.getElementById('change-form')
      .addEventListener('submit', async e => {
        e.preventDefault();

        const msg = document.getElementById(
          'message'
        );

        const current = document.getElementById(
          'current'
        ).value;

        const next = document.getElementById(
          'new'
        ).value;

        if (
          next !==
          document.getElementById('confirm').value
        ) {
          msg.textContent =
            'New passwords do not match.';
          return;
        }

        msg.textContent = 'Updating password...';

        try {
          const result = await api(
            '/api/auth/change-password',
            {
              method: 'POST',
              body: {
                current_password: current,
                new_password: next
              }
            }
          );

          saveSession(
            result.token,
            result.user
          );

          msg.textContent =
            'Password changed successfully.';

          location.replace('dashboard.html');

        } catch (err) {
          msg.textContent = err.message;
        }
      });
  </script>

  <script
    src="js/password-toggle.js"
    defer
  ></script>
</body>
</html>
