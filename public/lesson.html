<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lesson - Learning Module System</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <div id="msg" class="msg" role="alert"></div>
    <section class="card">
      <div class="row between">
        <h1 id="title" style="margin:0">Lesson</h1>
        <a id="back" class="btn small secondary" href="courses.html">Back to course</a>
      </div>
      <p class="muted" id="meta"></p>
      <div id="content" style="white-space:pre-wrap;line-height:1.6"></div>
    </section>

    <section class="card">
      <h2>Resources</h2>
      <div id="resources"><p class="empty">Loading...</p></div>
      <form id="resource-form" class="row" hidden style="margin-top:12px">
        <input name="title" placeholder="Title" required style="flex:2;min-width:140px">
        <select name="type" style="width:auto"><option>link</option><option>pdf</option><option>video</option><option>document</option></select>
        <input name="url" placeholder="https://..." required style="flex:3;min-width:180px">
        <button class="small" type="submit">Add resource</button>
      </form>
    </section>

    <section class="card" id="progress-card" hidden>
      <h2>Your progress</h2>
      <div class="row between"><span id="progress-text" class="muted"></span><button id="complete-btn">Mark as complete</button></div>
      <div id="next-steps" style="margin-top:12px"></div>
    </section>

    <section class="card" id="edit-card" hidden>
      <h2>Edit lesson</h2>
      <form id="edit-form" class="stack">
        <label for="e-title">Title</label><input id="e-title" required>
        <label for="e-content">Content</label><textarea id="e-content" style="min-height:200px"></textarea>
        <label for="e-status">Status</label>
        <select id="e-status"><option value="published">published</option><option value="draft">draft</option></select>
        <div class="row"><button type="submit">Save</button><button type="button" class="danger" id="delete-lesson">Delete lesson</button></div>
      </form>
    </section>
  </main>
  <script src="js/app.js"></script>
  <script src="js/lesson.js"></script>
</body>
</html>
