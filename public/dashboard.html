<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Dashboard - Learning Module System</title>

  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <header id="topbar"></header>

  <main class="container">

    <section class="card dashboard-hero">

      <div>
        <p
          class="muted"
          id="portal-label"
        >
          Learning Portal
        </p>

        <h1>
          Welcome back,
          <span id="name">Learner</span>!
        </h1>

        <p
          class="muted"
          id="subtitle"
        >
          Your learning workspace
        </p>
      </div>

      <span
        class="badge"
        id="role"
      ></span>

    </section>

    <div
      class="stats"
      id="dashboard-stats"
    ></div>

    <div class="dashboard-columns">

      <section class="card">

        <h2 id="courses-title">
          My Courses
        </h2>

        <div id="dashboard-courses">
          Loading courses...
        </div>

      </section>

    </div>

    <section
      class="card"
      id="class-section"
      hidden
    >

      <h2 id="class-title">
        My Students
      </h2>

      <div id="class-list"></div>

    </section>

    <section
      class="card"
      id="notifications-section"
    >

      <div class="row between">

        <h2>
          Notifications

          <span
            class="badge"
            id="unread-count"
          >
            0
          </span>
        </h2>

        <button
          type="button"
          class="secondary small"
          id="read-all"
        >
          Mark all as read
        </button>

      </div>

      <div id="notifications">
        Loading...
      </div>

    </section>

  </main>

  <script src="js/app.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/password-toggle.js" defer></script>

</body>
</html>
